<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Triton Trails</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="map"></div>
    <section id="chat" aria-label="Chat">
      <header>
        <img src="/logo-mark.png" alt="" width="22" height="22" />
        <strong>Triton Trails</strong>
        <span id="status">Loading campus…</span>
      </header>
      <ol id="messages" aria-live="polite"></ol>
      <form id="ask">
        <input id="prompt" placeholder="I have MATH 20C today in 30 minutes" autocomplete="off" disabled />
        <button type="submit" disabled>Send</button>
      </form>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
